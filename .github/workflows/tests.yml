name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    # The backend test suite (backend/tests/) runs against an in-memory
    # SQLite DB and a fake Redis (see backend/tests/conftest.py) — no real
    # Postgres/Redis/API keys needed. These are placeholder values so
    # Settings can load; nothing here ever makes a real network call.
    env:
      ENV: development
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql+asyncpg://test:test@localhost/test_db
      REDIS_URL: redis://localhost:6379
      PRIVATE_KEY: ci-test-private-key
      PUBLIC_KEY: ci-test-public-key
      OPENAI_API_KEY: sk-test
      GEMINI_API_KEY: test-key
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci-test-secret
      RAZORPAY_WEBHOOK_SECRET: ci-test-webhook-secret
      RAZORPAY_PRO_PLAN_ID: plan_test_pro
      RAZORPAY_ENTERPRISE_PLAN_ID: plan_test_enterprise

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests -v

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  desktop:
    name: Desktop TypeScript build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
        working-directory: electron
      - run: npm run build
        working-directory: electron
