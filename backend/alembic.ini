[alembic]
script_location = alembic
# Alembic is invoked with cwd = backend/ (e.g. `cd backend && alembic upgrade head`).
# ".." adds the repository root to sys.path so the `backend.` package-qualified
# imports in env.py resolve the same way they do for the running application.
prepend_sys_path = ..
version_path_separator = os

# DATABASE_URL is injected at runtime from env (see alembic/env.py)
sqlalchemy.url = postgresql+asyncpg://user:password@localhost/interviewcopilot

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
