services:
  # ── Backend API ──────────────────────────────────────────────
  # NOTE: all relative paths in this file (build contexts, bind mounts) are
  # relative to THIS file's directory (infra/), which is how Compose resolves
  # them by default — not relative to the repo root or the caller's cwd.
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-interviewcopilot}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-interviewcopilot}
      REDIS_URL: redis://redis:6379
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewcopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-interviewcopilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - app-network

  # ── Database Migrations ──────────────────────────────────────
  alembic:
    build:
      context: ../backend
    # cwd = /app/backend, matching alembic.ini's `prepend_sys_path = ..`
    # (which adds /app — containing the `backend` package — to sys.path).
    working_dir: /app/backend
    command: alembic upgrade head
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-interviewcopilot}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-interviewcopilot}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - migrate

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
